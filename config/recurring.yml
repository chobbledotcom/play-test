---
# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day
development:
  backup:
    class: BackupJob
    queue: default
    args: [:both]
    schedule: at 2am every day
    description: Daily full backup (database + Active Storage) to S3 and local
test:
  backup:
    class: BackupJob
    queue: default
    args: [:s3]
    schedule: every 5 minutes
    description: Test full backup to S3 (runs every 5 minutes for testing)
production:
  backup:
    class: BackupJob
    queue: default
    args: [:s3]
    schedule: at 2am every day
    description: Daily full backup (database + Active Storage) to S3
  clear_solid_queue_finished_jobs:
    command: 'SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)'
    schedule: every hour at minute 12
