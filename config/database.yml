---
# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  # Enable WAL mode for Litestream replication
  # WAL mode is required for Litestream to track changes
  pragmas:
    journal_mode: wal
    busy_timeout: 5000
    synchronous: normal
    mmap_size: 134217728
    journal_size_limit: 67108864
development:
  <<: *default
  database: storage/development.sqlite3
# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
# WAL allows browser requests and the test thread to read concurrently with
# writes. A separate file per process also isolates simultaneous suite runs.
# Mutant opts into memory before boot so kill-forks never share a database file.
test:
<% if ENV["IN_MEMORY_DB"] == "true" %>
  adapter: sqlite3
  database: "file::memory:?cache=shared"
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  pragmas:
    journal_mode: memory
    synchronous: "off"
    busy_timeout: 5000
<% else %>
  <<: *default
  database: tmp/test-<%= Process.pid %>.sqlite3
<% end %>
# SQLite3 write its data on the local filesystem, as such it requires
# persistent disks. If you are deploying to a managed service, you should
# make sure it provides disk persistence, as many don't.
#
# Similarly, if you deploy your application as a Docker container, you must
# ensure the database is located in a persisted volume.
production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
