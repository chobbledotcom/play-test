name: Coverage Report

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2am
  workflow_dispatch:  # Manual trigger

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Run all tests with coverage
        env:
          RAILS_ENV: test
          SIMPLECOV_COBERTURA: true
          RSPEC_JUNIT_FORMATTER: true
          RSPEC_JUNIT_OUTPUT: junit.xml
        run: |
          bundle exec rake coverage:parallel

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run all tests with coverage (normal format)
        env:
          RAILS_ENV: test
        run: |
          bundle exec rake coverage:parallel
  
      - name: Deploy to Bunny CDN
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: BunnyWay/actions/deploy-site@deploy-site_0.1.1
        with:
          site: play-test-coverage
          directory: coverage
          api_key: ${{ secrets.BUNNY_ACCESS_KEY }}
          cli_version: "0.19"
          deployments: true
