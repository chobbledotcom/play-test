name: "Test: Ruby"

on:
  pull_request:
  merge_group:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-suite:
          - controllers
          - features  
          - models
          - requests
          - services
          - helpers
          - lib
          - seeds
          - views

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      # No database prep: each test process uses its own SQLite WAL database,
      # loads db/schema.rb at boot, and removes it after the suite
      # (see spec/rails_helper.rb).

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bundle exec parallel_rspec spec/${{ matrix.test-suite }}
