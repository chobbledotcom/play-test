---
name: Automerge
on:
  pull_request:
    types:
      - labeled
      - ready_for_review
      - synchronize
      - unlabeled
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  automerge:
    runs-on: ubuntu-latest
    steps:
      # Native auto-merge integrates with the required merge queue on main.
      # The REST merge endpoint used previously (pascalgn/automerge-action)
      # is rejected by merge queues with "Changes must be made through the
      # merge queue", so the queue drained nothing.
      # Branches are deleted by the repository's delete_branch_on_merge
      # setting once the queue merges the pull request.
      - name: Enable auto-merge for labelled pull requests
        if: github.event.action != 'unlabeled'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pr in $(gh pr list -R "$GITHUB_REPOSITORY" --state open --label automerge --limit 100 --json number --jq '.[].number'); do
            echo "Enabling auto-merge for PR #$pr"
            gh pr merge -R "$GITHUB_REPOSITORY" "$pr" --squash --auto \
              || echo "PR #$pr is not eligible for auto-merge yet"
          done

      - name: Disable auto-merge when the label is removed
        if: github.event.action == 'unlabeled' && !contains(github.event.pull_request.labels.*.name, 'automerge')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge -R "$GITHUB_REPOSITORY" "$PR_NUMBER" --disable-auto \
            || echo "Auto-merge was not enabled"
