name: 'Setup Test Environment'
description: 'Sets up the common test environment for CI workflows'

runs:
  using: "composite"
  steps:
    - name: Install packages
      # Rugged's static OpenSSL link needs libjitterentropy3-dev on Ubuntu 26.
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          curl google-chrome-stable libjemalloc2 libjitterentropy3-dev \
          libvips42 sqlite3

    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: .ruby-version
        bundler-cache: true
